# CYPURRPUNK automatic builds.
# Every push to main builds Windows, Linux, macOS, Android and iOS, then replaces the files on
# the rolling "latest" GitHub Release. The README's download links always point at that release.
# Plain-English explanation: SETUP_GUIDE.md section 18.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: # Adds a "Run workflow" button on the Actions tab.

# A newer push cancels the build still running for an older one.
concurrency:
  group: build-main
  cancel-in-progress: true

# Lets the workflow create and update the GitHub Release with no extra tokens.
permissions:
  contents: write

env:
  # Must match the Godot the project is made with. When you update Godot, change these two lines.
  GODOT_VERSION: "4.7.2"
  GODOT_EDITOR_SERIES: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the game files
        uses: actions/checkout@v4

      - name: Set up Java 17 (Android needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Godot + templates are about 1.3 GB to download, so they are kept between builds.
      - name: Restore Godot from the cache
        id: godot_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and the export templates
        if: steps.godot_cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the platforms we build: skipping the rest keeps the cache small.
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -q -j /tmp/templates.tpz -d "$templates" \
            -x 'templates/ios*' 'templates/macos*' 'templates/web*' \
               'templates/*arm32*' 'templates/*arm64*' 'templates/*x86_32*'

      # Android apps must be signed, and a phone only accepts an update signed with the SAME key.
      # So the key lives in a repository secret. Without the secret a throwaway key is made, which
      # still installs, but players then have to uninstall the old version first.
      - name: Prepare the Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          keystore="$HOME/cypurrpunk-debug.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the saved signing key."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set: using a throwaway key, so this APK cannot update an older install."
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=CYPURRPUNK, O=CYPURRPUNK, C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Tell Godot where the Android tools are
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_EDITOR_SERIES}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_EDITOR_SERIES}.tres

      # .godot/ is not on GitHub, so textures, sounds and scripts are imported fresh every build.
      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/CYPURRPUNK.exe
          test -s build/windows/CYPURRPUNK.exe
          (cd build/windows && zip -9 ../CYPURRPUNK-Windows.zip CYPURRPUNK.exe)

      - name: Export Linux
        run: |
          mkdir -p build/linux
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/cypurrpunk.x86_64
          test -s build/linux/cypurrpunk.x86_64
          chmod +x build/linux/cypurrpunk.x86_64
          # zip keeps the "can be run" permission, so players can unzip and double-click.
          (cd build/linux && zip -9 ../CYPURRPUNK-Linux.zip cypurrpunk.x86_64)

      - name: Export Android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-debug "Android" build/android/CYPURRPUNK-Android.apk
          test -s build/android/CYPURRPUNK-Android.apk
          # Fails the build if the APK did not come out properly signed.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --print-certs build/android/CYPURRPUNK-Android.apk

      - name: Upload Windows, Linux, and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-android-builds
          path: |
            build/CYPURRPUNK-Windows.zip
            build/CYPURRPUNK-Linux.zip
            build/android/CYPURRPUNK-Android.apk

  build-apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Get the game files
        uses: actions/checkout@v4

      - name: Restore Godot (macOS) from the cache
        id: godot_cache_macos
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and the Apple export templates
        if: steps.godot_cache_macos.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q -j /tmp/templates.tpz -d "$templates" \
            'templates/macos*' 'templates/ios*'

      - name: Import the project
        run: ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --import

      - name: Export macOS (universal, ad-hoc signed)
        run: |
          mkdir -p build/macos
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "macOS" build/macos/CYPURRPUNK.app
          test -d build/macos/CYPURRPUNK.app
          # Apple Silicon Macs require at least a free ad-hoc signature to launch.
          codesign --force --deep --sign - build/macos/CYPURRPUNK.app
          ditto -c -k --sequesterRsrc --keepParent build/macos/CYPURRPUNK.app build/CYPURRPUNK-macOS.zip
          test -s build/CYPURRPUNK-macOS.zip

      - name: Export and package iOS (unsigned .ipa for sideloading)
        run: |
          mkdir -p build/ios/xcode_build build/ios/Payload
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/CYPURRPUNK.xcodeproj
          xcodebuild -project build/ios/CYPURRPUNK.xcodeproj \
            -scheme CYPURRPUNK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build \
            SYMROOT="$(pwd)/build/ios/xcode_build"
          app_path=$(find build/ios/xcode_build -name "CYPURRPUNK.app" -type d | head -n 1)
          test -n "$app_path"
          cp -R "$app_path" build/ios/Payload/CYPURRPUNK.app
          (cd build/ios && zip -r -9 ../CYPURRPUNK-iOS.ipa Payload)
          test -s build/CYPURRPUNK-iOS.ipa

      - name: Upload macOS and iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: |
            build/CYPURRPUNK-macOS.zip
            build/CYPURRPUNK-iOS.ipa

  release:
    needs: [build, build-apple]
    runs-on: ubuntu-latest
    steps:
      - name: Get the game files
        uses: actions/checkout@v4

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Commit:** ${GITHUB_SHA:0:7}"
            echo
            echo "**What changed:**"
            echo
            git log -1 --format=%B
          } > /tmp/release_notes.md

          # Move the "latest" tag to this commit, then refresh the release that hangs off it.
          # (Updating in place, not deleting, keeps the download links working during the update.)
          git tag -f latest
          git push -f origin refs/tags/latest

          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest \
              release-artifacts/CYPURRPUNK-Windows.zip \
              release-artifacts/CYPURRPUNK-Linux.zip \
              release-artifacts/CYPURRPUNK-macOS.zip \
              release-artifacts/CYPURRPUNK-Android.apk \
              release-artifacts/CYPURRPUNK-iOS.ipa \
              --clobber
            gh release edit latest --title "CYPURRPUNK (latest build)" --notes-file /tmp/release_notes.md --latest
          else
            gh release create latest \
              release-artifacts/CYPURRPUNK-Windows.zip \
              release-artifacts/CYPURRPUNK-Linux.zip \
              release-artifacts/CYPURRPUNK-macOS.zip \
              release-artifacts/CYPURRPUNK-Android.apk \
              release-artifacts/CYPURRPUNK-iOS.ipa \
              --title "CYPURRPUNK (latest build)" --notes-file /tmp/release_notes.md --latest
          fi
